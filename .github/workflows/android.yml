name: Build Android app

on:
  push:
    paths:
      - 'zero-widget-src.tgz'
      - 'ovr-*'
      - '.github/workflows/android.yml'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - '*.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack source
        run: tar xzf zero-widget-src.tgz

      - name: Apply newer source files
        run: |
          W=android/app/src/main
          J=$W/java/app/zero/widget
          [ -f ovr-MainActivity.kt ] && cp ovr-MainActivity.kt $J/MainActivity.kt
          [ -f ovr-Data.kt ] && cp ovr-Data.kt $J/Data.kt
          [ -f ovr-strings.xml ] && cp ovr-strings.xml $W/res/values/strings.xml
          [ -f ovr-colors.xml ] && cp ovr-colors.xml $W/res/values/colors.xml
          [ -f ovr-shortcuts.xml ] && cp ovr-shortcuts.xml $W/res/xml/shortcuts.xml
          [ -f ovr-ic_fg.png ] && cp ovr-ic_fg.png $W/res/drawable-nodpi/ic_fg.png
          [ -f ovr-logo.png ] && cp ovr-logo.png $W/res/drawable-nodpi/logo.png
          for f in add today tasks review; do [ -f sc-$f.png ] && cp sc-$f.png $W/res/drawable-nodpi/sc_$f.png; done
          true

      - name: Bundle the app's interface into the APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html app.js styles.css manifest.webmanifest *.png android/app/src/main/assets/www/

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk zero-widget.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-${{ github.run_number }}
          name: Ctrl Z ${{ github.run_number }}
          body: Android app with home-screen widget. Install zero-widget.apk on your phone or tablet.
          files: zero-widget.apk
          make_latest: true
