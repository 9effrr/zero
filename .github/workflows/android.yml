name: Build Android app

on:
  push:
    paths:
      - 'zero-widget-src.tgz'
      - '.github/workflows/android.yml'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack source
        run: tar xzf zero-widget-src.tgz

      - name: Bundle the app's interface into the APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html app.js styles.css manifest.webmanifest *.png android/app/src/main/assets/www/

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk zero-widget.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-${{ github.run_number }}
          name: Zerodocs control ${{ github.run_number }}
          body: Android app with home-screen widget. Install zero-widget.apk on your phone or tablet.
          files: zero-widget.apk
          make_latest: true
